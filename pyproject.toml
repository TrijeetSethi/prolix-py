[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prolix"
dynamic = ["version"]
description = "Heuristic clarity and vagueness scoring for English prose"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "the prolix authors", email = "developers@vague.io" }]
keywords = ["nlp", "readability", "prose", "vagueness", "wordnet", "clarity", "linguistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "nltk>=3.9.1",
    "wn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # The version CI runs. The rule set is fixed under [tool.ruff.lint].
    "ruff==0.17.4",
]
# Readability metrics are always available. This extra installs nothing and is
# kept as a no-op so that installs naming it keep working.
readability = []
# Semantic coherence scoring via sentence embeddings (MiniLM-L6-v2).
# Requires sentence-transformers for lazy model download (about 90 MB, cached).
semantic-coherence = [
    "sentence-transformers>=3.0",
]
# Convenience extra that enables every runtime feature. Development tools stay in dev.
all = ["prolix[readability,semantic-coherence]"]

[project.urls]
Homepage = "https://github.com/TrijeetSethi/prolix-py"
Repository = "https://github.com/TrijeetSethi/prolix-py"
Documentation = "https://github.com/TrijeetSethi/prolix-py/blob/main/README.md"
Changelog = "https://github.com/TrijeetSethi/prolix-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/TrijeetSethi/prolix-py/issues"

[project.scripts]
prolix = "prolix.cli:main"
prolix-dir = "prolix.cli:entry_dir"

[tool.hatch.version]
path = "src/prolix/__init__.py"

# The sdist ships the tests and their fixtures so that it can be tested on its own.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE-2.0",
    "/pyproject.toml",
]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/prolix"]
include = [
    "LICENSE-MIT",
    "LICENSE-APACHE-2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# The rule set is listed in full, so that a newer ruff does not turn on more
# rules by itself. E4, E7, E9 and F are the ruff defaults, and D101 to D103
# require a docstring on every public class, method and function.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[[tool.mypy.overrides]]
module = ["nltk", "nltk.*", "sentence_transformers"]
ignore_missing_imports = true

# model_compare is a research module that is not type-checked.
[[tool.mypy.overrides]]
module = ["prolix.model_compare"]
ignore_errors = true
