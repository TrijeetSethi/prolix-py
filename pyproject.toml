[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clarity-score"
dynamic = ["version"]
description = "Scores a sentence's clarity via syntactic-ambiguity, WordNet-based specificity, and vague-word heuristics"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "the clarity-score authors", email = "developers@vague.io" }]
keywords = ["clarity", "sentences", "natural-language", "wordnet", "linguistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "nltk>=3.9.1",
    "wn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Readability metrics are always available. This extra installs nothing and is
# kept as a no-op so that installs naming it keep working.
readability = []
# Semantic coherence scoring via sentence embeddings (MiniLM-L6-v2).
# Requires sentence-transformers for lazy model download (about 90 MB, cached).
semantic-coherence = [
    "sentence-transformers>=3.0",
]
# Convenience extra that enables every runtime feature. Development tools stay in dev.
all = ["clarity-score[readability,semantic-coherence]"]

[project.urls]
Homepage = "https://github.com/treejay/vague"
Repository = "https://github.com/treejay/vague"
Documentation = "https://github.com/treejay/vague/blob/main/python/README.md"
Changelog = "https://github.com/treejay/vague/blob/main/python/CHANGELOG.md"

[project.scripts]
clarity-score = "clarity_score.cli:entry_single"
clarity-score-dir = "clarity_score.cli:entry_dir"
clarity-score-compare = "clarity_score.cli:entry_compare"

[tool.hatch.version]
path = "src/clarity_score/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_score"]
include = [
    "LICENSE-MIT",
    "LICENSE-APACHE-2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[[tool.mypy.overrides]]
module = ["nltk", "nltk.*", "sentence_transformers"]
ignore_missing_imports = true

# model_compare is a research module that is not type-checked.
[[tool.mypy.overrides]]
module = ["clarity_score.model_compare"]
ignore_errors = true
