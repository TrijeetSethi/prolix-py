[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarity-score"
version = "0.1.0"
description = "Scores a sentence's clarity via syntactic-ambiguity, WordNet-based specificity, and vague-word heuristics"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "the clarity-score authors" }]
dependencies = [
    "nltk>=3.9",
    "wn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Placeholder for the future transformer-based SemanticScorer described in
# ../ARCHITECTURE.md — not implemented yet, never a default dependency.
transformer = [
    "transformers>=4.40",
    "torch>=2.2",
]
# Readability metrics (Flesch-Kincaid, Gunning Fog, SMOG, etc.)
# Zero additional dependencies — pure Python math on top of stdlib.
readability = []
# Semantic coherence scoring via sentence embeddings (MiniLM-L6-v2).
# Requires sentence-transformers for lazy model download (~24MB, cached).
semantic-coherence = [
    "sentence-transformers>=3.0",
]
# Convenience extra that enables everything
all = ["clarity-score[dev,readability,semantic-coherence]"]

[project.scripts]
clarity-score = "clarity_score.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_score"]

[tool.ruff]
line-length = 100
